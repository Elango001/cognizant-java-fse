<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Colors</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="text-center text-primary mb-5">Dashboard</h1>

      <div class="row g-4">
        <div class="col-md-3">
          <div class="card bg-primary text-white">
            <div class="card-body text-center">
              <h2>120</h2>
              <p>Total Users</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card bg-success text-white">
            <div class="card-body text-center">
              <h2>85</h2>
              <p>Orders</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card bg-warning">
            <div class="card-body text-center">
              <h2>45</h2>
              <p>Pending Tasks</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card bg-danger text-white">
            <div class="card-body text-center">
              <h2>12</h2>
              <p>Alerts</p>
            </div>
          </div>
        </div>
      </div>

      <div class="card mt-5">
        <div class="card-body">
          <h3 class="text-success">Monthly Report</h3>

          <p class="text-secondary">
            This dashboard demonstrates Bootstrap contextual background and text
            color utility classes.
          </p>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
