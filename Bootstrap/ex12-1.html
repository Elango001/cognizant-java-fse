<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacing Utilities</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container">
      <h1 class="text-center text-primary mt-4">Bootstrap Spacing Utilities</h1>

      <!-- Margin Example -->
      <div class="bg-primary text-white m-3 p-2">
        This section uses m-3 (margin) and p-2 (padding).
      </div>

      <!-- Margin Top Example -->
      <div class="bg-success text-white mt-4 p-2">
        This section uses mt-4 (margin-top) and p-2 (padding).
      </div>

      <!-- Vertical Padding Example -->
      <div class="bg-warning py-5 text-center mt-4">
        This section uses py-5 (vertical padding).
      </div>

      <!-- Combined Example -->
      <div class="card mt-4">
        <div class="card-body p-4">
          <h3>Card Example</h3>

          <p>
            Bootstrap spacing utilities help control margins and padding without
            writing custom CSS.
          </p>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
