<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Object Layout</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center text-primary mb-4">Media Object Layout</h1>

      <div class="card shadow">
        <div class="card-body">
          <div class="d-flex">
            <img
              src="/images/img1.jpg"
              width="100"
              alt="Profile"
              class="rounded me-3"
            />

            <div>
              <h3>John Doe</h3>

              <h6 class="text-muted">Software Developer</h6>

              <p>
                This layout places an image on the left and the content on the
                right. Bootstrap 5 uses Flexbox utilities instead of the old
                media object component.
              </p>

              <button class="btn btn-primary">Read More</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
