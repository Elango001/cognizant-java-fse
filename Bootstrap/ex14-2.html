<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Sidebar</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <div
          class="col-md-3 col-lg-2 d-none d-md-block bg-dark text-white min-vh-100"
        >
          <div class="p-3">
            <h3 class="mb-4">Dashboard</h3>

            <ul class="nav flex-column">
              <li class="nav-item mb-2">
                <a href="#" class="nav-link text-white"> Home </a>
              </li>

              <li class="nav-item mb-2">
                <a href="#" class="nav-link text-white"> Profile </a>
              </li>

              <li class="nav-item mb-2">
                <a href="#" class="nav-link text-white"> Reports </a>
              </li>

              <li class="nav-item">
                <a href="#" class="nav-link text-white"> Settings </a>
              </li>
            </ul>
          </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10">
          <div class="p-4">
            <h1 class="text-primary">Main Content Area</h1>

            <p>
              The sidebar is hidden on mobile devices and becomes visible on
              tablets and larger screens.
            </p>

            <div class="card">
              <div class="card-body">
                <h4>Content Section</h4>

                <p>
                  This area can contain dashboard information, reports, charts,
                  or other application content.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
