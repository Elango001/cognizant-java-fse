<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Section</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="text-center text-primary mb-5">Pricing Plans</h1>

      <div class="row g-4">
        <!-- Basic Plan -->
        <div class="col-md-4">
          <div class="card h-100 shadow">
            <div class="card-header text-center bg-primary text-white py-3">
              Basic
            </div>

            <div class="card-body text-center p-4">
              <h2 class="mb-3">₹499</h2>

              <p class="mb-3">10 GB Storage</p>

              <p class="mb-3">Email Support</p>

              <p class="mb-4">Single User</p>

              <button class="btn btn-primary">Choose Plan</button>
            </div>
          </div>
        </div>

        <!-- Standard Plan -->
        <div class="col-md-4">
          <div class="card h-100 shadow">
            <div class="card-header text-center bg-success text-white py-3">
              Standard
            </div>

            <div class="card-body text-center p-4">
              <h2 class="mb-3">₹999</h2>

              <p class="mb-3">50 GB Storage</p>

              <p class="mb-3">Priority Support</p>

              <p class="mb-4">Up to 5 Users</p>

              <button class="btn btn-success">Choose Plan</button>
            </div>
          </div>
        </div>

        <!-- Premium Plan -->
        <div class="col-md-4">
          <div class="card h-100 shadow">
            <div class="card-header text-center bg-danger text-white py-3">
              Premium
            </div>

            <div class="card-body text-center p-4">
              <h2 class="mb-3">₹1999</h2>

              <p class="mb-3">Unlimited Storage</p>

              <p class="mb-3">24/7 Support</p>

              <p class="mb-4">Unlimited Users</p>

              <button class="btn btn-danger">Choose Plan</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
