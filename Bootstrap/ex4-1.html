<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Layout</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center text-primary mb-4">Two Column Layout</h1>

      <div class="row">
        <div class="col-md-3 mb-3">
          <div class="card">
            <div class="card-header bg-dark text-white">Sidebar</div>

            <div class="card-body">
              <ul class="list-group">
                <li class="list-group-item">Home</li>

                <li class="list-group-item">Profile</li>

                <li class="list-group-item">Settings</li>

                <li class="list-group-item">Contact</li>
              </ul>
            </div>
          </div>
        </div>

        <div class="col-md-9">
          <div class="card">
            <div class="card-header bg-primary text-white">Main Content</div>

            <div class="card-body">
              <h3>Welcome</h3>

              <p>
                This section represents the content area. The sidebar occupies 3
                columns and the content area occupies 9 columns out of
                Bootstrap's 12-column grid system.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
