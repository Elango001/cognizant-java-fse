<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alignment Example</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center text-primary mb-4">Center Alignment Example</h1>

      <div
        class="row justify-content-center align-items-center"
        style="height: 300px; border: 2px solid black"
      >
        <div class="col-4">
          <div class="card text-center">
            <div class="card-body">
              <h4>Centered Content</h4>

              <p>This content is centered horizontally and vertically.</p>

              <button class="btn btn-primary">Click Here</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
