<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon Only Buttons</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center text-primary mb-4">Icon Only Buttons</h1>

      <div class="text-center">
        <!-- Edit -->
        <button class="btn btn-primary me-2">
          <i class="bi bi-pencil-fill"></i>
        </button>

        <!-- Delete -->
        <button class="btn btn-danger me-2">
          <i class="bi bi-trash-fill"></i>
        </button>

        <!-- Search -->
        <button class="btn btn-success me-2">
          <i class="bi bi-search"></i>
        </button>

        <!-- Download -->
        <button class="btn btn-warning me-2">
          <i class="bi bi-download"></i>
        </button>

        <!-- Settings -->
        <button class="btn btn-dark">
          <i class="bi bi-gear-fill"></i>
        </button>
      </div>

      <div class="card mt-5">
        <div class="card-body">
          <h4>Icons Used</h4>

          <ul>
            <li>Pencil - Edit</li>
            <li>Trash - Delete</li>
            <li>Search - Search</li>
            <li>Download - Download</li>
            <li>Gear - Settings</li>
          </ul>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
