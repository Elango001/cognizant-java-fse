<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Background</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="bg-dark bg-gradient text-white p-5 rounded shadow">
        <h1 class="display-4">Welcome to Bootstrap 5</h1>

        <p class="lead">
          This section uses a dark background with Bootstrap's gradient utility.
        </p>

        <button class="btn btn-light">Learn More</button>
      </div>

      <div class="card mt-4">
        <div class="card-body">
          <h3>About This Example</h3>

          <p>
            The <strong>bg-gradient</strong> class adds a subtle gradient effect
            to the background color, making sections more visually appealing.
          </p>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
