<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Icons Example</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center text-primary">Bootstrap Icons Demo</h1>

      <p class="text-center">Social media icons are displayed in the footer.</p>
    </div>

    <footer class="bg-dark text-white text-center p-4 mt-5">
      <h5>Follow Us</h5>

      <a href="#" class="text-white fs-3 me-3">
        <i class="bi bi-facebook"></i>
      </a>

      <a href="#" class="text-white fs-3 me-3">
        <i class="bi bi-instagram"></i>
      </a>

      <a href="#" class="text-white fs-3 me-3">
        <i class="bi bi-twitter-x"></i>
      </a>

      <a href="#" class="text-white fs-3">
        <i class="bi bi-linkedin"></i>
      </a>
    </footer>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
