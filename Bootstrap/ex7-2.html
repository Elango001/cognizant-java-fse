<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Transformation Utilities</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center text-primary mb-4">
        Bootstrap Text Transformation Utilities
      </h1>

      <div class="card">
        <div class="card-body">
          <h4>Original Text</h4>
          <p>Hello Bootstrap World</p>

          <hr />

          <h4>Uppercase</h4>
          <p class="text-uppercase">Hello Bootstrap World</p>

          <hr />

          <h4>Lowercase</h4>
          <p class="text-lowercase">Hello Bootstrap World</p>

          <hr />

          <h4>Capitalize</h4>
          <p class="text-capitalize">hello bootstrap world</p>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
