<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borders and Rounded Image</title>

    <link
      rel="stylesheet"
      href="/Bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center text-primary mb-5">Border Utilities Example</h1>

      <div class="text-center">
        <img
          src="/images/img1.jpg"
          alt="Profile Image"
          width="150"
          height="150"
          class="border border-primary border-3 rounded-circle"
        />
      </div>

      <div class="card mt-5">
        <div class="card-body">
          <h4>Applied Classes</h4>

          <ul>
            <li><strong>border</strong> - Adds a border.</li>
            <li>
              <strong>border-primary</strong> - Applies Bootstrap primary color.
            </li>
            <li><strong>border-3</strong> - Makes the border thicker.</li>
            <li>
              <strong>rounded-circle</strong> - Converts image into a circle.
            </li>
          </ul>
        </div>
      </div>
    </div>

    <script src="/Bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
